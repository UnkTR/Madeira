name: Build Madeira IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  # Pinned so cache keys stay stable across runs.
  LLVM_TAG: llvmorg-15.0.7
  LLVM_MINGW_RELEASE: 20260421
  IOS_MIN: "17.0"

jobs:
  build:
    # macos-15 only ships Xcode <26, which doesn't have -downloadComponent.
    # macos-26 is GitHub's Xcode-26 image (arm64-only, which is what we want
    # anyway for a native-speed iOS toolchain build).
    runs-on: macos-26
    timeout-minutes: 350 # stay under the 360min free-tier hard limit

    steps:
      - name: Checkout Madeira (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install cmake/ninja/meson/bison + gnutls + llvm (build deps)
        run: |
          brew install cmake ninja meson pkg-config bison gnutls llvm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # build/wineserver/build.sh hardcodes a Homebrew llvm-objcopy path
          # and only falls back to it when `command -v llvm-objcopy` fails;
          # put brew llvm on PATH so the symbol-rename sweep finds it.
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          # Wine's gnutls probe defines HAVE_GNUTLS_CIPHER_INIT from the
          # header test, but its WINE_CHECK_SONAME link test runs
          # `LIBS="-lgnutls $GNUTLS_LIBS ..."`, i.e. a bare -lgnutls BEFORE
          # any -L path, so it fails and its not-found branch resets
          # GNUTLS_CFLAGS="". make then dies on
          # ../dlls/bcrypt/gnutls.c:34: 'gnutls/gnutls.h' file not found.
          # LDFLAGS is expanded before LIBS by autoconf, so putting the
          # Homebrew keg on LDFLAGS lets the soname test link; CPPFLAGS is a
          # belt-and-braces include path for the compile itself. This keeps
          # gnutls enabled in build-macos's config.h for the iOS
          # bcrypt/secur32 unixlibs.
          GNUTLS_PREFIX="$(brew --prefix gnutls)"
          echo "LDFLAGS=-L${GNUTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${GNUTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${GNUTLS_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "GNUTLS_CFLAGS=-I${GNUTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "GNUTLS_LIBS=-L${GNUTLS_PREFIX}/lib -lgnutls" >> "$GITHUB_ENV"
          # The -lgnutls link probe keeps failing (it tries the bare lib
          # before any -L), so config.h never gets SONAME_LIBGNUTLS and
          # dlls/bcrypt/gnutls.c:385 fails with "use of undeclared
          # identifier 'SONAME_LIBGNUTLS'". Seed the autoconf cache with the
          # real Homebrew soname instead; the iOS gnutls shim only needs the
          # name to contain "gnutls".
          GNUTLS_SONAME="$(otool -D "${GNUTLS_PREFIX}/lib/libgnutls.dylib" | tail -n 1)"
          GNUTLS_SONAME="${GNUTLS_SONAME##*/}"
          echo "ac_cv_lib_soname_gnutls=${GNUTLS_SONAME}" >> "$GITHUB_ENV"
          echo "gnutls soname: ${GNUTLS_SONAME}"

      - name: Sanity check toolchain versions (fail fast)
        run: |
          echo "bison: $(bison --version | head -1)"
          BISON_MAJOR=$(bison --version | head -1 | grep -oE '[0-9]+' | head -1)
          if [ "$BISON_MAJOR" -lt 3 ]; then
            echo "::error::bison is still < 3.0 — PATH isn't picking up the brew version"
            exit 1
          fi
          echo "cmake: $(cmake --version | head -1)"
          echo "ninja: $(ninja --version)"
          echo "meson: $(meson --version)"
          echo "gnutls: $(pkg-config --modversion gnutls)"
          echo "llvm-objcopy: $(llvm-objcopy --version | head -1)"

      # ---------------------------------------------------------------
      # llvm-mingw prebuilt toolchain — wine's configure needs this for
      # --with-mingw. Moved early (before the expensive Metal Toolchain
      # download / freetype / LLVM-iOS build) so that if wine's configure
      # or build breaks, we find out in ~2min instead of ~25min.
      # ---------------------------------------------------------------
      - name: Download llvm-mingw
        run: |
          mkdir -p toolchains
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_RELEASE}/llvm-mingw-${LLVM_MINGW_RELEASE}-ucrt-macos-universal.tar.xz" \
            | tar -xJ -C toolchains/

      # ---------------------------------------------------------------
      # Wine's build-macos configure. Neither the Madeira repo nor the
      # willfaust/wine fork documents the original invocation, so this is
      # the best-effort reconstruction. Observed CI failures and fixes:
      #   #4 bison < 3       -> brew bison + GITHUB_PATH (see steps above)
      #   #5 freetype        -> --without-freetype
      #   #6 gnutls header   -> CPPFLAGS/LDFLAGS + ac_cv_lib_soname_gnutls
      #   #9 -Bsymbolic      -> drop --host=aarch64-apple-ios so configure
      #                         takes the Darwin branch (-dynamiclib)
      #   #10 xlate_ios_jit  -> non-ARM64EC PE fallback (step below) and
      #                         --enable-archs=aarch64 (no i386; the app
      #                         only ships aarch64/arm64ec)
      #   #11 ios_srcwatch    -> host unix-lib links (e.g. win32u.so) fail on
      #                         iOS-only symbols the fork adds to dibdrv; we
      #                         only need config.h + widl headers + tools, so
      #                         keep going past the host link stage (-k).
      # NOTE: build-macos is consumed for config.h, the widl-generated
      # headers (include/dwrite_3.h included) and tools/winebuild; the host
      # unix .so files are not used by the iOS build scripts.
      # ---------------------------------------------------------------
      - name: Patch Wine fork for non-ARM64EC PE link
        working-directory: wine
        run: |
          cat >> dlls/ntdll/loader.c <<'EOF'

          #if !defined(__arm64ec__)
          void *xlate_ios_jit( void *ptr ) { return ptr; }
          #endif
          EOF

      - name: Configure + build Wine (build-macos)
        working-directory: wine
        run: |
          mkdir -p build-macos && cd build-macos
          ../configure \
            --enable-archs=aarch64 \
            --with-mingw="$GITHUB_WORKSPACE/toolchains/llvm-mingw-${LLVM_MINGW_RELEASE}-ucrt-macos-universal/bin/clang" \
            --without-x --without-opengl --without-freetype --disable-tests
          # The fork's win32u/dibdrv references iOS-only symbols (e.g.
          # ios_srcwatch_arm, no weak attribute) that a plain macOS host build
          # does not define, so host unix-lib links fail. Keep going; the
          # artifacts we need are produced before/independently of that.
          make -j"$(sysctl -n hw.ncpu)" -k || \
            echo "::warning::make reported failures (expected: host unix-lib links); continuing"
          test -x tools/winebuild/winebuild
          test -f include/config.h
          test -f include/dwrite_3.h

      # ---------------------------------------------------------------
      # Metal Toolchain — required by dxmt-ios. This is the biggest
      # unknown: on some Xcode/CI combos this needs an Apple ID signed
      # into Xcode first. If this step fails, that's the first thing
      # to report back — we may need `xcodebuild -downloadAllPlatforms`
      # or a manual login step via a secrets-based Apple ID.
      # ---------------------------------------------------------------
      - name: Download Metal Toolchain component
        run: sudo xcodebuild -downloadComponent MetalToolchain

      # ---------------------------------------------------------------
      # freetype 2.13.3 — consumed by build/win32u-unix/build.sh
      # ---------------------------------------------------------------
      - name: Clone freetype 2.13.3
        run: |
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git research/freetype

      - name: Build freetype for iOS
        run: bash build/freetype-ios/build.sh

      # ---------------------------------------------------------------
      # GnuTLS stack (GMP -> nettle/hogweed -> GnuTLS) cross-built as
      # iOS-aarch64 static libs into toolchains/gnutls-ios. Consumed by the
      # bcrypt/secur32/crypt32 unixlibs of libntdll_unix.a (and by
      # build/crypto-unix/gen_gnutls_symtab.sh). Sources are the tarballs
      # vendored under build/gnutls-ios/src/.
      # ---------------------------------------------------------------
      - name: Cache GnuTLS iOS stack
        id: gnutls-cache
        uses: actions/cache@v4
        with:
          path: toolchains/gnutls-ios
          key: gnutls-ios-${{ hashFiles('build/gnutls-ios/build.sh') }}

      - name: Build GnuTLS stack for iOS
        if: steps.gnutls-cache.outputs.cache-hit != 'true'
        run: bash build/gnutls-ios/build.sh

      # Save immediately: actions/cache's post-step only persists on a
      # successful job, and this job intentionally keeps going to expose the
      # next failure, so we must save mid-job.
      - name: Save GnuTLS iOS stack cache
        if: steps.gnutls-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/gnutls-ios
          key: gnutls-ios-${{ hashFiles('build/gnutls-ios/build.sh') }}

      # ---------------------------------------------------------------
      # LLVM 15.0.7 cross-built for iOS-aarch64 (feeds dxmt-ios's
      # libdxmt_combined.a). Two-stage build per build/dxmt-ios/README.md.
      # This is the single most expensive step (can be 1-2+ hours) so
      # it's cached by commit/tag — subsequent runs should skip it.
      # ---------------------------------------------------------------
      - name: Cache LLVM iOS build
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: toolchains/llvm-ios-build
          key: llvm-ios-${{ env.LLVM_TAG }}-v1

      - name: Clone LLVM source
        # The cached tree only holds toolchains/llvm-ios-build, but dxmt's
        # LLVM_INCLUDES also points at toolchains/llvm-project/llvm/include,
        # so the source must be present even on a cache hit.
        run: |
          if [ ! -d toolchains/llvm-project/llvm ]; then
            git clone --depth 1 --branch "${LLVM_TAG}" \
              https://github.com/llvm/llvm-project.git toolchains/llvm-project
          fi

      - name: Patch AddLLVM.cmake for iOS dead_strip
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' \
            toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake

      - name: Build host llvm-tblgen
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=AArch64
          cmake --build toolchains/llvm-host-build --target llvm-tblgen

      - name: Build LLVM libs for iOS-aarch64
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_TARGETS_TO_BUILD=AArch64
          cmake --build toolchains/llvm-ios-build

      - name: Save LLVM iOS build cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/llvm-ios-build
          key: llvm-ios-${{ env.LLVM_TAG }}-v1

      - name: Build ntdll-unix
        run: bash build/ntdll-unix/build.sh

      - name: Build win32u-unix
        run: bash build/win32u-unix/build.sh

      # ---------------------------------------------------------------
      # build/wineserver/build.sh only *patches* a prebuilt
      # obj/libwineserver.a (or app/Madeira/libwineserver.a) — it never
      # builds the base archive, which was a local-only artifact for the
      # original author. Bootstrap it by compiling the non-patched
      # server/*.c with the same flags build.sh uses; build.sh then swaps
      # in its patched/iOS-override objects.
      # ---------------------------------------------------------------
      - name: Bootstrap wineserver base archive
        run: |
          set -e
          WD=build/wineserver
          OBJ=$WD/obj
          WINE_SRC=wine
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          REPLACED="request main mach unicode fd object async process window user mapping class region queue winstation thread sock"
          mkdir -p "$OBJ/base"
          for src in "$WINE_SRC"/server/*.c; do
            n=$(basename "$src" .c)
            case " $REPLACED " in *" $n "*) continue ;; esac
            echo "  base $n"
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2 \
              -I"$WINE_SRC/include" -I"$WINE_SRC/include/wine" \
              -I"$WINE_SRC/build-macos/include" \
              -I"$WD" -I"$WINE_SRC/server" -I"build/ntdll-unix/shims" \
              -include "$WD/config_ios.h" -include stdarg.h \
              -include "$WD/unicode_fix.h" -include "$WD/wineserver_ios_kill.h" \
              -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\" \
              -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main \
              -Wno-implicit-function-declaration \
              -c "$src" -o "$OBJ/base/$n.o"
          done
          ar rcs "$OBJ/libwineserver.a" "$OBJ"/base/*.o
          echo "base objects: $(ls "$OBJ"/base | wc -l)"

      - name: Build wineserver
        run: bash build/wineserver/build.sh

      # ---------------------------------------------------------------
      # build/dxmt-ios/build.sh compiles airconv_context.cpp which includes
      # air_msad.h / air_samplepos.h / air_tessellation.h, and adds
      # -I.../shader-headers, but nothing generates them. Reproduce DXMT's
      # meson generators (airconv/shaders/*.metal -> .air via the Metal
      # toolchain, then xxd -n <name> -i into a C header).
      # ---------------------------------------------------------------
      - name: Generate dxmt shader headers
        run: |
          set -e
          mkdir -p build/dxmt-ios/shader-headers
          cd research/dxmt/src/airconv/shaders
          for s in air_msad air_samplepos air_tessellation; do
            echo "  generating $s.h"
            xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 -o "$s.air" -c "$s.metal"
            xxd -n "$s" -i "$s.air" "$GITHUB_WORKSPACE/build/dxmt-ios/shader-headers/$s.h"
          done

      - name: Build dxmt-ios (libdxmt_combined.a + PE DLLs)
        run: |
          bash build/dxmt-ios/build.sh || {
            for f in build/dxmt-ios/obj/*.err; do
              if [ -s "$f" ]; then echo "===== $f ====="; cat "$f"; fi
            done
            exit 1
          }

      # build/dxmt-ios/README.md: combine the DXMT unix objects with the
      # LLVM iOS static libs into the single archive Xcode links.
      - name: Combine libdxmt_combined.a
        run: |
          cd build/dxmt-ios
          xcrun -sdk iphoneos libtool -static -o libdxmt_combined.a \
            obj/*.o ../../toolchains/llvm-ios-build/lib/*.a
          cp libdxmt_combined.a ../../app/Madeira/
          echo "libdxmt_combined.a: $(wc -c < libdxmt_combined.a | tr -d ' ') bytes"

      # ---------------------------------------------------------------
      # FEX iOS static libs. app/Madeira.xcodeproj links
      # ../../FEX/build-ios/{FEXCore/Source/libFEXCore*.a,External/...};
      # FEX's CMakeLists supports CMAKE_SYSTEM_NAME=iOS, so configure a
      # Release arm64 iOS build (no LTO, no tests/thunks/config).
      # ---------------------------------------------------------------
      - name: Cache FEX iOS build
        id: fex-cache
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: fex-ios-${{ hashFiles('FEX/CMakeLists.txt') }}-v1

      - name: Patch FEX LinkerGC for Apple linker
        if: steps.fex-cache.outputs.cache-hit != 'true'
        run: |
          # Data/CMake/LinkerGC.cmake unconditionally adds
          # -Wl,--gc-sections -Wl,--strip-all -Wl,--as-needed to every
          # Release-config target. Those are GNU ld/lld-only flags; Apple's
          # ld64 (used here via clang++ for the iOS build) rejects them with
          # "unknown options", which fails the libFEXCore.dylib link.
          # Skip the block on Apple platforms — ld64 has its own equivalents
          # (-dead_strip, separate `strip`) but this build doesn't need them
          # to succeed, so just drop the GNU-only flags here.
          sed -i '' 's/if (CMAKE_BUILD_TYPE MATCHES "RELEASE")/if (CMAKE_BUILD_TYPE MATCHES "RELEASE" AND NOT APPLE)/' \
            FEX/Data/CMake/LinkerGC.cmake
          grep -n "RELEASE" FEX/Data/CMake/LinkerGC.cmake

      - name: Patch FEX AddLibrary to link FEXCore_Base on Apple
        if: steps.fex-cache.outputs.cache-hit != 'true'
        run: |
          # FEXCore/Source/CMakeLists.txt builds FEXCore/FEXCore_shared from
          # $<TARGET_OBJECTS:FEXCore_object> only, which does NOT propagate
          # FEXCore_object's transitively linked libraries (fmt, xxhash,
          # cephes_128bit, FEXHeaderUtils, CodeEmitter — all pulled in via
          # FEXCore_Base). FEX papers over this for MINGW by explicitly
          # re-linking FEXCore_Base in AddLibrary(), but Linux never notices
          # because ld allows undefined symbols in a shared lib by default.
          # Apple's ld64 does not, so libFEXCore.dylib fails with dozens of
          # "Undefined symbols" (fmt::, XXH3_64bits, cephes_128bit::*,
          # extF80_*, FEXCore::Config::*, LogMan::Msg::* — all FEXCore_Base
          # or its LIBS). Extend the existing MINGW-only fix to APPLE too.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("FEX/FEXCore/Source/CMakeLists.txt")
          s = p.read_text()
          old = "  if (MINGW)\n    target_link_libraries(${Name} PRIVATE FEXCore_Base)\n  endif()"
          new = "  if (MINGW OR APPLE)\n    target_link_libraries(${Name} PRIVATE FEXCore_Base)\n  endif()"
          assert old in s, "AddLibrary MINGW block not found — FEX source layout changed"
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("patched AddLibrary() to link FEXCore_Base on Apple too")
          PY

      - name: Build FEX for iOS
        if: steps.fex-cache.outputs.cache-hit != 'true'
        run: |
          # The fork's IosLogUnimplementedCASPAL() is a diagnostic that calls
          # Windows APIs (MEMORY_BASIC_INFORMATION/VirtualQuery/MEM_IMAGE)
          # with no non-Windows guard, which cannot compile on iOS. Replace it
          # with a no-op.
          python3 - <<'PY'
          import pathlib

          # Arm64.cpp: IosLogUnimplementedCASPAL() is a diagnostic that calls
          # Windows APIs with no non-Windows guard; replace it with a no-op.
          p = pathlib.Path("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp")
          s = p.read_text()
          start = s.index("static void IosLogUnimplementedCASPAL")
          end = s.index("static bool HandleCASPAL", start)
          stub = ("static void IosLogUnimplementedCASPAL(uint32_t Size, uint64_t* GPRs, uint32_t AddressReg) {\n"
                  "  (void)Size; (void)GPRs; (void)AddressReg;\n}\n\n")
          p.write_text(s[:start] + stub + s[end:])

          # Core.cpp: the ml316/ml306 reporters use IosFfsBypassLog /
          # IosCbEntryLog, which are declared only under FEX_IOS_HOST, but the
          # block itself is unguarded. FEX_IOS_HOST is intentionally NOT set
          # here (a plain iOS FEXCore: the ARM64EC alias hooks live in
          # Source/Windows/ARM64EC and are not linked by the app), so guard
          # the block to match. NOTE: anchor on the comment opener, otherwise
          # the inserted #ifdef lands inside the /* ... */ comment.
          p = pathlib.Path("FEX/FEXCore/Source/Interface/Core/Core.cpp")
          s = p.read_text()
          start = s.index("/* iOS-Madeira ml316: report ExitToX64 FFS bypasses")
          end = s.index("/* iOS-Madeira: refuse to compile obviously-invalid guest RIPs", start)
          p.write_text(s[:start] + "#ifdef FEX_IOS_HOST\n" + s[start:end] + "#endif\n" + s[end:])

          # Core.cpp: rpm_cas_snapshot_take() is a host-bridge hook with no
          # definition anywhere in FEX (or the app); its caller is a
          # diagnostic, so provide a no-op definition rather than a dangling
          # undefined symbol that would fail the app link.
          s = p.read_text()
          s = s.replace("int rpm_cas_snapshot_take(struct rpm_cas_snapshot* out);",
                        "int rpm_cas_snapshot_take(struct rpm_cas_snapshot* out) { (void)out; return 0; }", 1)
          p.write_text(s)
          print("patched FEX iOS diagnostics")
          PY
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DTUNE_CPU=none \
            -DBUILD_TESTING=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF
          # Only the static archives the Xcode project links. Building the
          # default target also builds libFEXCore.dylib, which pulls in the
          # ARM64EC-only iOS alias symbols that nothing defines.
          cmake --build FEX/build-ios -j"$(sysctl -n hw.ncpu)" --target FEXCore FEXCore_Base JemallocLibs

      - name: Save FEX iOS build cache
        if: steps.fex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-ios
          key: fex-ios-${{ hashFiles('FEX/CMakeLists.txt') }}-v1

      # ---------------------------------------------------------------
      # Unsigned build + manual IPA packaging, same approach that already
      # worked for NuvioMobile-iOS. Signing in CI needs a team plus
      # certificates/provisioning profiles (APPLE_TEAM_ID is unset here, and
      # Automatic signing aborts with "requires a development team"), so
      # build unsigned and let the user re-sign locally.
      # ---------------------------------------------------------------
      - name: Build unsigned Madeira.app
        run: |
          xcodebuild build \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -derivedDataPath "$PWD/build/dd"

      - name: Package unsigned IPA
        run: |
          cd "$PWD/build/dd/Build/Products/Release-iphoneos"
          mkdir -p Payload
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Madeira-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp Madeira-unsigned.ipa "$GITHUB_WORKSPACE/output/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: output/Madeira-unsigned.ipa
          if-no-files-found: error
