name: Build Madeira IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  # Pinned so cache keys stay stable across runs.
  LLVM_TAG: llvmorg-15.0.7
  LLVM_MINGW_RELEASE: 20260421
  IOS_MIN: "17.0"

jobs:
  build:
    # macos-15 only ships Xcode <26, which doesn't have -downloadComponent.
    # macos-26 is GitHub's Xcode-26 image (arm64-only, which is what we want
    # anyway for a native-speed iOS toolchain build).
    runs-on: macos-26
    timeout-minutes: 350 # stay under the 360min free-tier hard limit

    steps:
      - name: Checkout Madeira (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install cmake/ninja/meson/bison + gnutls (build deps)
        run: |
          brew install cmake ninja meson pkg-config bison gnutls
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # Wine's gnutls probe defines HAVE_GNUTLS_CIPHER_INIT from the
          # header test, but its WINE_CHECK_SONAME link test runs
          # `LIBS="-lgnutls $GNUTLS_LIBS ..."`, i.e. a bare -lgnutls BEFORE
          # any -L path, so it fails and its not-found branch resets
          # GNUTLS_CFLAGS="". make then dies on
          # ../dlls/bcrypt/gnutls.c:34: 'gnutls/gnutls.h' file not found.
          # LDFLAGS is expanded before LIBS by autoconf, so putting the
          # Homebrew keg on LDFLAGS lets the soname test link; CPPFLAGS is a
          # belt-and-braces include path for the compile itself. This keeps
          # gnutls enabled in build-macos's config.h for the iOS
          # bcrypt/secur32 unixlibs.
          GNUTLS_PREFIX="$(brew --prefix gnutls)"
          echo "LDFLAGS=-L${GNUTLS_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${GNUTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${GNUTLS_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "GNUTLS_CFLAGS=-I${GNUTLS_PREFIX}/include" >> "$GITHUB_ENV"
          echo "GNUTLS_LIBS=-L${GNUTLS_PREFIX}/lib -lgnutls" >> "$GITHUB_ENV"
          # The -lgnutls link probe keeps failing (it tries the bare lib
          # before any -L), so config.h never gets SONAME_LIBGNUTLS and
          # dlls/bcrypt/gnutls.c:385 fails with "use of undeclared
          # identifier 'SONAME_LIBGNUTLS'". Seed the autoconf cache with the
          # real Homebrew soname instead; the iOS gnutls shim only needs the
          # name to contain "gnutls".
          GNUTLS_SONAME="$(otool -D "${GNUTLS_PREFIX}/lib/libgnutls.dylib" | tail -n 1)"
          GNUTLS_SONAME="${GNUTLS_SONAME##*/}"
          echo "ac_cv_lib_soname_gnutls=${GNUTLS_SONAME}" >> "$GITHUB_ENV"
          echo "gnutls soname: ${GNUTLS_SONAME}"

      - name: Sanity check toolchain versions (fail fast)
        run: |
          echo "bison: $(bison --version | head -1)"
          BISON_MAJOR=$(bison --version | head -1 | grep -oE '[0-9]+' | head -1)
          if [ "$BISON_MAJOR" -lt 3 ]; then
            echo "::error::bison is still < 3.0 — PATH isn't picking up the brew version"
            exit 1
          fi
          echo "cmake: $(cmake --version | head -1)"
          echo "ninja: $(ninja --version)"
          echo "meson: $(meson --version)"
          echo "gnutls: $(pkg-config --modversion gnutls)"

      # ---------------------------------------------------------------
      # llvm-mingw prebuilt toolchain — wine's configure needs this for
      # --with-mingw. Moved early (before the expensive Metal Toolchain
      # download / freetype / LLVM-iOS build) so that if wine's configure
      # or build breaks, we find out in ~2min instead of ~25min.
      # ---------------------------------------------------------------
      - name: Download llvm-mingw
        run: |
          mkdir -p toolchains
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_RELEASE}/llvm-mingw-${LLVM_MINGW_RELEASE}-ucrt-macos-universal.tar.xz" \
            | tar -xJ -C toolchains/

      # ---------------------------------------------------------------
      # Wine's build-macos configure. Neither the Madeira repo nor the
      # willfaust/wine fork documents the original invocation, so this is
      # the best-effort reconstruction. Observed CI failures and fixes:
      #   #4 bison < 3       -> brew bison + GITHUB_PATH (see steps above)
      #   #5 freetype        -> --without-freetype
      #   #6 gnutls header   -> CPPFLAGS/LDFLAGS + ac_cv_lib_soname_gnutls
      #   #9 -Bsymbolic      -> drop --host=aarch64-apple-ios so configure
      #                         takes the Darwin branch (-dynamiclib)
      #   #10 xlate_ios_jit  -> non-ARM64EC PE fallback (step below) and
      #                         --enable-archs=aarch64 (no i386; the app
      #                         only ships aarch64/arm64ec)
      #   #11 ios_srcwatch    -> host unix-lib links (e.g. win32u.so) fail on
      #                         iOS-only symbols the fork adds to dibdrv; we
      #                         only need config.h + widl headers + tools, so
      #                         keep going past the host link stage (-k).
      # NOTE: build-macos is consumed for config.h, the widl-generated
      # headers (include/dwrite_3.h included) and tools/winebuild; the host
      # unix .so files are not used by the iOS build scripts.
      # ---------------------------------------------------------------
      - name: Patch Wine fork for non-ARM64EC PE link
        working-directory: wine
        run: |
          cat >> dlls/ntdll/loader.c <<'EOF'

          #if !defined(__arm64ec__)
          void *xlate_ios_jit( void *ptr ) { return ptr; }
          #endif
          EOF

      - name: Configure + build Wine (build-macos)
        working-directory: wine
        run: |
          mkdir -p build-macos && cd build-macos
          ../configure \
            --enable-archs=aarch64 \
            --with-mingw="$GITHUB_WORKSPACE/toolchains/llvm-mingw-${LLVM_MINGW_RELEASE}-ucrt-macos-universal/bin/clang" \
            --without-x --without-opengl --without-freetype --disable-tests
          # The fork's win32u/dibdrv references iOS-only symbols (e.g.
          # ios_srcwatch_arm, no weak attribute) that a plain macOS host build
          # does not define, so host unix-lib links fail. Keep going; the
          # artifacts we need are produced before/independently of that.
          make -j"$(sysctl -n hw.ncpu)" -k || \
            echo "::warning::make reported failures (expected: host unix-lib links); continuing"
          test -x tools/winebuild/winebuild
          test -f include/config.h
          test -f include/dwrite_3.h

      # ---------------------------------------------------------------
      # Metal Toolchain — required by dxmt-ios. This is the biggest
      # unknown: on some Xcode/CI combos this needs an Apple ID signed
      # into Xcode first. If this step fails, that's the first thing
      # to report back — we may need `xcodebuild -downloadAllPlatforms`
      # or a manual login step via a secrets-based Apple ID.
      # ---------------------------------------------------------------
      - name: Download Metal Toolchain component
        run: sudo xcodebuild -downloadComponent MetalToolchain

      # ---------------------------------------------------------------
      # freetype 2.13.3 — consumed by build/win32u-unix/build.sh
      # ---------------------------------------------------------------
      - name: Clone freetype 2.13.3
        run: |
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git research/freetype

      - name: Build freetype for iOS
        run: bash build/freetype-ios/build.sh

      # ---------------------------------------------------------------
      # GnuTLS stack (GMP -> nettle/hogweed -> GnuTLS) cross-built as
      # iOS-aarch64 static libs into toolchains/gnutls-ios. Consumed by the
      # bcrypt/secur32/crypt32 unixlibs of libntdll_unix.a (and by
      # build/crypto-unix/gen_gnutls_symtab.sh). Sources are the tarballs
      # vendored under build/gnutls-ios/src/.
      # ---------------------------------------------------------------
      - name: Build GnuTLS stack for iOS
        run: bash build/gnutls-ios/build.sh

      # ---------------------------------------------------------------
      # LLVM 15.0.7 cross-built for iOS-aarch64 (feeds dxmt-ios's
      # libdxmt_combined.a). Two-stage build per build/dxmt-ios/README.md.
      # This is the single most expensive step (can be 1-2+ hours) so
      # it's cached by commit/tag — subsequent runs should skip it.
      # ---------------------------------------------------------------
      - name: Cache LLVM iOS build
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: toolchains/llvm-ios-build
          key: llvm-ios-${{ env.LLVM_TAG }}-v1

      - name: Clone LLVM source
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${LLVM_TAG}" \
            https://github.com/llvm/llvm-project.git toolchains/llvm-project

      - name: Patch AddLLVM.cmake for iOS dead_strip
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' \
            toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake

      - name: Build host llvm-tblgen
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=AArch64
          cmake --build toolchains/llvm-host-build --target llvm-tblgen

      - name: Build LLVM libs for iOS-aarch64
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_TARGETS_TO_BUILD=AArch64
          cmake --build toolchains/llvm-ios-build

      - name: Build ntdll-unix
        run: bash build/ntdll-unix/build.sh

      - name: Build win32u-unix
        run: bash build/win32u-unix/build.sh

      - name: Build wineserver
        run: bash build/wineserver/build.sh

      - name: Build dxmt-ios (libdxmt_combined.a + PE DLLs)
        run: bash build/dxmt-ios/build.sh

      # ---------------------------------------------------------------
      # App build + ad-hoc export with a free Apple ID / Personal Team,
      # same approach that already worked for NuvioMobile-iOS.
      # ---------------------------------------------------------------
      - name: Archive Madeira.app
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -archivePath "$PWD/build/Madeira.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Madeira.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: build/ipa/*.ipa
